services:
  db:
    image: postgres:16-alpine
    container_name: secretary-db
    environment:
      POSTGRES_DB: secretary_v2
      POSTGRES_USER: secretary
      POSTGRES_PASSWORD: secret
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U secretary -d secretary_v2"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s
    volumes:
      - postgres_data:/var/lib/postgresql/data

  backend:
    build:
      context: ./Secretary_backend_v2
      dockerfile: Dockerfile
    container_name: secretary-backend
    depends_on:
      db:
        condition: service_healthy
    environment:
      APP_ENV: local
      APP_DEBUG: "true"
      APP_URL: http://localhost:8000
      FRONTEND_URL: http://localhost:5173
      DB_CONNECTION: pgsql
      DB_HOST: db
      DB_PORT: 5432
      DB_DATABASE: secretary_v2
      DB_USERNAME: secretary
      DB_PASSWORD: secret
      SESSION_DRIVER: database
      CACHE_STORE: database
      QUEUE_CONNECTION: database
      PORT: 8000
      HOST: 0.0.0.0
    ports:
      - "8000:8000"
    volumes:
      - ./Secretary_backend_v2:/app

  frontend:
    build:
      context: ./Secretary_frontend_v2
      dockerfile: Dockerfile
    container_name: secretary-frontend
    depends_on:
      - backend
    environment:
      VITE_BACKEND_URL: /api
      VITE_API_PROXY_TARGET: http://backend:8000
    ports:
      - "5173:5173"
    volumes:
      - ./Secretary_frontend_v2:/frontend

volumes:
  postgres_data:
